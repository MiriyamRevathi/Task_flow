{% extends "base.html" %}
{% block title %}Create Team — TaskFlow{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="fw-bold mb-3">Create Team</h4>
                <form method="POST" action="{{ url_for('team.create') }}">
                    <div class="mb-3">
                        <label class="form-label">Team Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g. Core Engineering">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="department" value="Engineering">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Team Lead</label>
                        <select class="form-select" name="lead_id">
                            <option value="">Select Team Lead</option>
                            {% for u in users %}
                            <option value="{{ u.id }}">{{ u.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" style="background: #4f46e5;">Create Team</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
