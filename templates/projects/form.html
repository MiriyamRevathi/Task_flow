{% extends "base.html" %}
{% block title %}Create Project — TaskFlow{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="fw-bold mb-3">Create New Project</h4>
                <form method="POST" action="{{ url_for('project.create') }}">
                    <div class="mb-3">
                        <label class="form-label">Project Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g. Website Redesign">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Priority</label>
                            <select class="form-select" name="priority">
                                <option value="LOW">LOW</option>
                                <option value="MEDIUM" selected>MEDIUM</option>
                                <option value="HIGH">HIGH</option>
                                <option value="CRITICAL">CRITICAL</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Target Budget ($)</label>
                            <input type="number" step="0.01" class="form-control" name="budget" placeholder="50000.00">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" style="background: #4f46e5;">Create Project</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
