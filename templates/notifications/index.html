{% extends "base.html" %}
{% block title %}Notifications — TaskFlow{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Notification Center</h3>
        <form method="POST" action="{{ url_for('notification.mark_read_all') }}">
            <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-check2-all"></i> Mark All Read</button>
        </form>
    </div>

    <div class="card shadow-sm border-0">
        <ul class="list-group list-group-flush">
            {% for n in notifications %}
            <li class="list-group-item p-3 {{ 'bg-light' if not n.read }}">
                <div class="d-flex justify-content-between">
                    <h6 class="fw-bold mb-1">{{ n.title }}</h6>
                    <small class="text-muted">{{ n.created_at[:10] }}</small>
                </div>
                <p class="mb-0 text-secondary">{{ n.message }}</p>
            </li>
            {% else %}
            <li class="list-group-item text-center py-4 text-muted">No notifications.</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
