{% extends "base.html" %}
{% block title %}Milestones — TaskFlow{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <h3 class="fw-bold mb-4">Project Milestones</h3>
    <div class="card shadow-sm border-0 p-4">
        {% for ms in milestones %}
        <div class="border-bottom py-3">
            <h5>{{ ms.title }}</h5>
            <p class="text-muted small mb-1">{{ ms.description }}</p>
            <div class="progress" style="height: 6px;">
                <div class="progress-bar bg-success" style="width: {{ ms.completion_percentage }}%;"></div>
            </div>
        </div>
        {% else %}
        <p class="text-muted text-center py-4">No milestones created in this workspace.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
