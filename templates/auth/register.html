<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — TaskFlow Enterprise SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { width: 100%; max-width: 480px; border-radius: 12px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #fff; padding: 2.5rem; }
        .auth-brand { font-size: 1.8rem; font-weight: 700; color: #4f46e5; display: flex; align-items: center; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-brand">
            <span>⚡ TaskFlow</span>
        </div>
        <h4 class="text-center mb-4">Create Enterprise Account</h4>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="first_name" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" required placeholder="John">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="last_name" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" required placeholder="Doe">
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="john.doe@company.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role">
                    <option value="EMPLOYEE" selected>Employee / Team Member</option>
                    <option value="PROJECT_MANAGER">Project Manager</option>
                    <option value="TEAM_LEAD">Team Lead</option>
                    <option value="VIEWER">Read-Only Viewer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background: #4f46e5; border: none;">Create Account</button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted">Already have an account?</span> <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold" style="color: #4f46e5;">Sign In</a>
        </div>
    </div>
</body>
</html>
