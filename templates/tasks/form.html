{% extends "base.html" %}
{% block title %}Create Task — TaskFlow{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="fw-bold mb-3">Create New Task</h4>
                <form method="POST" action="{{ url_for('task.create') }}">
                    <div class="mb-3">
                        <label class="form-label">Project</label>
                        <select class="form-select" name="project_id" required>
                            {% for p in projects %}
                            <option value="{{ p.id }}">{{ p.name }} ({{ p.key }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Task Title</label>
                        <input type="text" class="form-control" name="title" required placeholder="e.g. Implement OAuth2 login">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Assignee</label>
                            <select class="form-select" name="assignee_id">
                                <option value="">Unassigned</option>
                                {% for u in users %}
                                <option value="{{ u.id }}">{{ u.full_name }} ({{ u.role }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Priority</label>
                            <select class="form-select" name="priority">
                                <option value="LOW">LOW</option>
                                <option value="MEDIUM" selected>MEDIUM</option>
                                <option value="HIGH">HIGH</option>
                                <option value="CRITICAL">CRITICAL</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Due Date</label>
                            <input type="date" class="form-control" name="due_date">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estimated Hours</label>
                            <input type="number" step="0.5" class="form-control" name="estimated_hours" placeholder="8.0">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" style="background: #4f46e5;">Create Task</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
